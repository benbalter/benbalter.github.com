StylesPath = .github/styles
Packages = Microsoft, alex, proselint, write-good, https://github.com/benbalter/vale-styles/releases/download/v0.0.8/BenBalter.zip, https://github.com/benbalter/vale-styles/releases/download/v0.0.8/AIPatterns.zip, https://github.com/benbalter/vale-styles/releases/download/v0.0.8/BenBalterConfig.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, alex, proselint, write-good, BenBalter, AIPatterns
# Heading IDs and directive attributes ({#some-slug}, {.class}) aren't prose;
# without this the hyphen/spelling rules fire on slugs like {#rarely-...}.
TokenIgnores = (\{[#.][^}]+\})
Microsoft.Adverbs = NO
Microsoft.Contractions = NO
Microsoft.FirstPerson = NO
Microsoft.GeneralURL = NO
Microsoft.Percentages = NO
Microsoft.Quotes = NO
Microsoft.Units = warning
Microsoft.We = NO
Vale.Spelling = NO

# Stylistic rules demoted to warning so CI (--minAlertLevel=error) gates on
# genuine problems without re-litigating 15 years of conversational posts.
# Where two packages flag the same concept, one source is disabled outright.
# The write-good and proselint rules every house repo turns off (passive,
# E-Prime, sentence-opening So/But, duplicate cliche and corporate-speak
# lists) live in vale-styles' shared BenBalterConfig package instead of here.
proselint.Very = warning
proselint.Skunked = warning
proselint.Uncomparables = warning
proselint.GenderBias = warning
write-good.ThereIs = warning
Microsoft.Plurals = warning
proselint.Typography = warning
proselint.Cursing = warning
proselint.Hyperbole = warning
proselint.Jargon = warning
proselint.Hedging = warning
proselint.DateSpacing = warning
Microsoft.Foreign = warning
Microsoft.DateOrder = warning
Microsoft.AMPM = warning
Microsoft.HeadingColons = warning
Microsoft.Auto = warning

# --- Disabled globally -------------------------------------------------------
# Categorical noise: every hit is a voice/style/score choice, not a defect, so
# there is no per-instance FP to grandfather — the rule itself is the wrong fit.
# (Distinct from rules kept at `warning` above, which catch real issues with the
# occasional false positive worth suppressing individually if ever raised to
# `error`.) These fired thousands of times across the back-catalog with ~zero
# actionable signal; disabling keeps advisory output legible.
Microsoft.Passive = NO
Microsoft.SentenceLength = NO # long sentences are intentional
alex.ProfanityUnlikely = NO   # false-positives on ordinary words (458 hits)
alex.ProfanityMaybe = NO
alex.Suicide = NO             # every hit is "hang" (an app/process hanging) — technical FP
alex.Condescending = NO       # deduped: BenBalter.Assumptive is the curated list (532 hits)
Microsoft.GenderBias = NO     # deduped: proselint.GenderBias; its hits were "Alumni"
Microsoft.Dashes = NO         # spaced en dashes in old posts; AIPatterns.EmDash covers em dashes
Microsoft.Avoid = NO          # Microsoft-docs vocabulary ("backend", "backbone")
Microsoft.UIVerbs = NO        # "click" is the right verb in how-to posts
Microsoft.Terms = NO          # Microsoft-docs word list: flags "agent" (AI agents, change agents) and
                              # "the cloud"; a full pass over every post (2026-11) found ~67 false
                              # positives and 4 real fixes
Microsoft.HeadingAcronyms = NO # flags API, URL, IBM, TL;DR, Roman numerals in headings; the same pass
                              # found 50 hits and fixed none (renaming would also change anchors)
# Readability (package removed above): grade-level scores, ~1,250 hits with
# nothing to act on per instance.

# --- ai-tells: measured, left off ------------------------------------------
# Checked 2026-10 against src/content/posts, pre-2022-12 (172 posts, ~215k
# words) vs since (25, ~32k): the drift signals (FigurativeDisguises,
# LabelAndExplain, EmphaticCopula, MicDrop, FalseExclusivity) now ship as
# curated AIPatterns rules in vale-styles v0.0.6. The rest either fire on
# pre-2023 voice (ConclusionMarkers, StackedHedges, WrapUpHeadings' "Putting it
# all together"), duplicate AIPatterns.MetaCommentary (UnpackExplore), or never
# fire (RedundantPrecaution). Run the full set ad hoc via .vale-ai-tells.ini.
