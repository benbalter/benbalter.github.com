StylesPath = .github/styles
Packages = Microsoft, alex, proselint, Readability, write-good, https://github.com/benbalter/vale-styles/releases/download/v0.0.3/BenBalter.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, alex, proselint, Readability, write-good, BenBalter, AIPatterns
alex.Condescending = warn
Microsoft.Adverbs = NO
Microsoft.Avoid = warn
Microsoft.Contractions = NO
Microsoft.Dashes = warn
Microsoft.FirstPerson = NO
Microsoft.GenderBias = warn
Microsoft.GeneralURL = NO
Microsoft.Percentages = NO
Microsoft.Quotes = NO
Microsoft.Units = warn
Microsoft.We = NO
Vale.Spelling = NO

# Stylistic rules demoted to warning so CI (--minAlertLevel=error) gates on
# genuine problems without re-litigating 15 years of conversational posts.
# Where two packages flag the same concept, one source is disabled outright.
proselint.Cliches = NO   # deduped: BenBalter.Cliches is the curated house list
proselint.Very = warning
proselint.Skunked = warning
proselint.Uncomparables = warning
proselint.GenderBias = warning
write-good.ThereIs = warning
write-good.So = NO
BenBalter.So = warning
proselint.But = NO
BenBalter.But = warning
proselint.CorporateSpeak = NO
BenBalter.CorporateSpeak = warning
BenBalter.FillerWords = warning
BenBalter.CulturalInclusion = warning
Microsoft.Plurals = warning
proselint.Typography = warning
proselint.Cursing = warning
proselint.Hyperbole = warning
proselint.Jargon = warning
proselint.Hedging = warning
proselint.DateSpacing = warning
Microsoft.Foreign = warning
Microsoft.DateOrder = warning
Microsoft.AMPM = warning
Microsoft.HeadingColons = warning
Microsoft.Auto = warning

# --- Disabled globally -------------------------------------------------------
# Categorical noise: every hit is a voice/style/score choice, not a defect, so
# there is no per-instance FP to grandfather — the rule itself is the wrong fit.
# (Distinct from rules kept at `warning` above, which catch real issues with the
# occasional false positive worth suppressing individually if ever raised to
# `error`.) These fired thousands of times across the back-catalog with ~zero
# actionable signal; disabling keeps advisory output legible.
write-good.E-Prime = NO       # bans every "to be"; an ideology, not a style rule
write-good.Passive = NO       # passive voice is a deliberate voice choice here
Microsoft.Passive = NO
Microsoft.SentenceLength = NO # long sentences are intentional
write-good.TooWordy = NO
alex.ProfanityUnlikely = NO   # false-positives on ordinary words (458 hits)
alex.ProfanityMaybe = NO
write-good.Cliches = NO       # deduped: superseded by BenBalter.Cliches
