---
Management:
  - title: High Output Management
    asin: B015VACHOK
    tldr: "It looks like it belongs on the airport bookstore's business-traveler shelf, but don't judge it by its cover. Intel's former CEO explains how to build and grow teams, and it still holds up."

  - title: "The Manager's Path: A Guide for Tech Leaders Navigating Growth and Change"
    asin: B06XP3GJ7F
    tldr: "A career map for engineering leaders, from mentoring an intern to running teams of teams, by Rent the Runway's former CTO. Practical advice for every step, so you know what the next job asks of you."

  - title: "The Making of a Manager: What to Do When Everyone Looks to You"
    asin: B079WNPRL2
    tldr: "A modern field guide to managing people in tech, from a design leader at Facebook who learned it on the job. Read it before your first one-on-one as a manager, not after."

  - title: "Managing Humans: Biting and Humorous Tales of a Software Engineering Manager"
    asin: B00ACC5Z1U
    tldr: "The jump from engineer to manager, told by someone who made it. Corporate politics, conflict, managing your boss, managing other geeks, and that strange ritual called meetings."

  - title: "Being Geek: The Software Developer's Career Handbook"
    asin: B003XDUCEU
    tldr: "Your career is about more than code. Should you become a manager, tell your boss they're a jerk, or join that startup? If you're a geek, this is the owner's manual for yourself."

  - title: "First, Break All the Rules: What the World's Greatest Managers Do Differently"
    asin: B01E7M6INO
    tldr: "Gallup boiled what makes a great workplace down to 12 simple questions, like whether you have what you need to do your job. The counterintuitive lesson is to build on people's strengths instead of fixing their weaknesses."

  - title: "Peopleware: Productive Projects and Teams"
    asin: B00DY5A8X2
    tldr: "The biggest problems in software are human, not technical, and managers who ignore them pay for it. Decades old and still right about quiet workspaces and teams that jell."

Leadership and culture:
  - title: "The Culture Code: The Secrets of Highly Successful Groups"
    asin: B01MSY1Y6Z
    tldr: "Great culture is a set of learnable behaviors, not luck. Coyle studies high-performing teams and distills what they do: build safety, share vulnerability, and establish purpose."

  - title: "The Art of Leadership: Small Things, Done Well"
    asin: B088KV4P6T
    tldr: "Leadership is less a grand philosophy for a chosen few than principled consistency. Small things done well, again and again, are what earn a team's trust and respect."

  - title: "Crucial Conversations: Tools for Talking When Stakes Are High"
    asin: B005K0AYH4
    tldr: "How to have the conversations you know you should but don't want to. The authors call them high-stakes; I'd call it real talk. A quick read on setting emotion aside and structuring what you say."

  - title: "Tribal Leadership: Leveraging Natural Groups to Build a Thriving Organization"
    asin: B006IDG1K6
    tldr: "Every organization runs on tribes, groups of 20–150 people that decide how much good work gets done. A 10-year study of 24,000 people maps five stages, from “life sucks” to “life is great.”"

  - title: "Remote Not Distant: Design a Company Culture That Will Help You Thrive in a Hybrid Workplace"
    asin: B09VXX4FN3
    tldr: "Hybrid work needs a culture designed on purpose, not one inherited from the office. A practical guide to keeping a team connected, working asynchronously, having hard conversations, and choosing your hybrid model."

Product and strategy:
  - title: "Good Strategy Bad Strategy: The Difference and Why It Matters"
    asin: B004J4WKEC
    tldr: "Most corporate strategy is just goals and fluff. Rumelt shows what the real thing looks like: a clear diagnosis of the problem, a guiding policy, and coherent actions that follow from it."

  - title: "Inspired: How To Create Products Customers Love"
    asin: B077NRB36N
    tldr: "The *TL;DR* of product management, start to finish. How to decide what to build, do user research, work with the rest of the company, balance priorities, and write specs."

  - title: "Escaping the Build Trap: How Effective Product Management Creates Real Value"
    asin: B07K3QBWG1
    tldr: "Shipping more features doesn't mean delivering more value. Companies that measure outputs instead of outcomes fall into the build trap, cranking out features to hit a schedule instead of meeting customer needs."

  - title: "The Innovator's Dilemma: When New Technologies Cause Great Firms to Fail"
    asin: B012BLTM6I
    tldr: "Why successful companies miss the next wave: doing everything right for today's customers is what leaves them open to disruption. If you own an established product, consider this your warning label."

  - title: "The Lean Startup: How Today's Entrepreneurs Use Continuous Innovation to Create Radically Successful Businesses"
    asin: B004J4XGN6
    tldr: "Treat a startup like an experiment. Ship small, measure what customers do (not vanity metrics), and let that validated learning tell you whether to keep going or pivot."

  - title: The Design of Everyday Things
    asin: B00E257T6C
    tldr: "If you've ever pushed a door marked pull, this book explains why. Norman's design thinking 101: make things visible, use natural mappings and constraints, and guide people to the right action without a manual."

  - title: "Users, Not Customers: Who Really Determines the Success of Your Business"
    asin: B00AK3WDZW
    tldr: "Stop trying to get people to buy stuff online and focus on the user experience. A relationship between people and a brand has real value, even before those users pay anything."

  - title: "The Personal MBA: Master the Art of Business"
    asin: B08H5PKGGG
    tldr: "Business for Dummies, but not for dummies. The core of an MBA (value creation, sales, marketing, finance, humans, and systems) in one book. No substitute for the degree, but you'll be conversant in how a business works."

Open source:
  - title: "Producing Open Source Software: How to Run a Successful Free Software Project"
    asin: B0026OR37Q
    tldr: "Most free software projects fail. Fogel covers the communication, governance, and infrastructure that set the survivors apart, whether you're starting a project or contributing to someone else's."

  - title: "The Cathedral & the Bazaar: Musings on Linux and Open Source by an Accidental Revolutionary"
    asin: B0026OR3LM
    tldr: "The essay that explained why open source works: release early, release often, and given enough eyeballs, all bugs are shallow. Required reading on how the bazaar beat the cathedral."

  - title: "Hackers: Heroes of the Computer Revolution"
    asin: B003PDMKIY
    tldr: "The history of the hacker ethic: the hands-on urge to take something apart, figure out how it works, share what you learned, and build something better. Open source culture starts here."

Security:
  - title: The Cuckoo's Egg
    asin: B0083DJXCM
    tldr: "A 75-cent accounting error leads an astronomer turned systems manager at Lawrence Berkeley Lab to a spy breaking into military networks. A true story that reads like a thriller, and an early lesson in incident response."

  - title: "Secrets and Lies: Digital Security in a Networked World"
    asin: B004UARVS0
    tldr: "Security is a process, not a product. Schneier explains why math alone won't save you, and why people, systems, and risk matter more. It has aged far better than most tech books from 2000."

  - title: Serious cryptography
    asin: B0722MTGQV
    tldr: "Modern encryption explained without dumbing down the math. Authenticated encryption, randomness, hash functions, block ciphers, RSA, and elliptic curves, with honest detail on how each works and how it fails."

Tech, policy, and society:
  - title: "The Master Switch: The Rise and Fall of Information Empires"
    asin: B003F3PKTK
    tldr: "Every American information industry, starting with the telephone, eventually fell to a monopoly or cartel. Wu's history is a warning about what happens when everything runs over one network."

  - title: "The Nerd Reich: Silicon Valley Fascism and the War on Democracy"
    asin: B0G3Q5BGRS
    tldr: "Some of tech's richest people would rather replace democratic government with corporate rule than reform it. Durán traces the idea from *The Sovereign Individual* to Thiel, Andreessen, and Musk."

  - title: "The Wealth of Networks: How Social Production Transforms Markets and Freedom"
    asin: B0015GWX0S
    tldr: "Collaborators and non-market actors, like Wikipedia and open source, are reshaping how things get made. Benkler argues social production is a real economic force in the networked information economy."

  - title: "Here Comes Everybody: The Power of Organizing Without Organizations"
    asin: B0013TTKQC
    tldr: "Cheap social tools let people form groups without an organization in charge. Shirky shows how that shift changes the way we come together, with lasting economic and social effects."

  - title: "The Internet Of Garbage"
    asin: B07GT9C337
    tldr: "Platforms can't end stalking, abuse, or harassment on their own. What they can do is design for better behavior through thoughtful architecture, active moderation, and real community management."

  - title: "Technically Wrong: Sexist Apps, Biased Algorithms, and Other Threats of Toxic Tech"
    asin: B06XJBGPT9
    tldr: "The apps we use for everything from groceries to dating are full of oversights, bias, and ethical nightmares. A clear-eyed look at the assumptions and processes in tech that produce them."

  - title: The Cluetrain Manifesto
    asin: B002EF2AE8
    tldr: "Markets are conversations. The internet shifted power from brands to people, and the brands that win sound like the humans behind them, not faceless blobs shouting the same message louder."

  - title: "The Long Tail: Why the Future of Business Is Selling Less of More"
    asin: B000JMKSE2
    tldr: "With effectively infinite shelf space online, the mainstream shatters into countless niches. Selling a little of a lot can add up to more than chasing the next blockbuster."

Government:
  - title: "Hack Your Bureaucracy: Get Things Done No Matter What Your Role on Any Team"
    asin: B09PL57GRD
    tldr: "Change doesn't happen just because the person in charge says so, whether that's your CEO or the President. Tactics for taking initiative from any role, on any team, and turning ideas into impact."

  - title: "Bureaucracy: What Government Agencies Do And Why They Do It"
    asin: "0465007856"
    tldr: "Why agencies behave the way they do, told from the bottom, where the work happens. Neither more money nor smaller government is the answer, and policy is too often written by people who don't understand implementation."

Communicating:
  - title: "Made to Stick: Why Some Ideas Survive and Others Die"
    asin: B000N2HCKQ
    tldr: "Urban legends spread effortlessly while important ideas die in slide decks. The Heath brothers break down why: sticky ideas are simple, unexpected, concrete, credible, emotional, and told as stories."

  - title: Typography for Lawyers
    asin: "1598390775"
    tldr: "Lawyers make documents, so the form deserves as much care as the content. A how-to on why typography matters and how to set legal type worthy of its words, useful well beyond the courtroom."
