extends: default

ignore: |
  .github/workflows/*.lock.yml
  .github/workflows/agentics-maintenance.yml

rules:
  document-start: disable
  line-length: disable
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
  # One space before trailing comments, the form Renovate writes in hints
  # and version annotations, so match it instead of fighting it.
  comments:
    min-spaces-from-content: 1
