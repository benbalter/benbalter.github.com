extends: default

ignore: |
  .github/workflows/*.lock.yml
  .github/workflows/agentics-maintenance.yml

rules:
  document-start: disable
  line-length: disable
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
  # Pinned actions use `uses: owner/action@<sha> # vX`, the one-space form
  # Renovate writes and keeps rewriting, so match it instead of fighting it.
  comments:
    min-spaces-from-content: 1
