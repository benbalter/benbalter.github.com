name: Astro E2E Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'tsconfig.astro.json'
      - 'public/**'
      - '*.md'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.lighthouserc.json'
      - '.htmlvalidate.json'
      - 'package*.json'
      - '.github/workflows/astro-e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'tsconfig.astro.json'
      - 'public/**'
      - '*.md'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.lighthouserc.json'
      - '.htmlvalidate.json'
      - 'package*.json'
      - '.github/workflows/astro-e2e.yml'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; main pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Astro build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.astro
          # The pipeline fingerprint (remark/rehype plugins, their config wiring, and
          # deps) is a distinct key segment AND the restore-keys prefix. Astro caches
          # rendered markdown per content-file digest and reuses it for unchanged files
          # regardless of plugin code, so a broad `astro-cache-<os>-` restore-key would
          # resurrect HTML built by an old pipeline (e.g. retired /q/<id> quote links).
          # Folding the pipeline hash into the prefix busts the cache when rendering
          # changes, while still reusing it across content-only edits.
          # src/data/acronyms.yml is rendering input (src/lib/rehype-acronyms.ts reads
          # it at module load), so it's part of the fingerprint too. Keep this key in
          # sync with build-and-deploy.yml.
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/lib/**', 'src/data/acronyms.yml', 'astro.config.mjs', 'src/content.config.ts', 'package-lock.json') }}-${{ hashFiles('src/**/*', 'public/**/*', 'tsconfig.astro.json') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-${{ hashFiles('src/lib/**', 'src/data/acronyms.yml', 'astro.config.mjs', 'src/content.config.ts', 'package-lock.json') }}-

      - name: Build Astro site
        run: npm run build

      # html-validate only: it's deterministic and takes seconds. The lychee
      # link check stays in links.yml, which is disabled.
      - name: Validate HTML (html-validate)
        run: npm run lint-html

      - name: Upload Astro build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-astro
          path: dist-astro/
          retention-days: 1
          include-hidden-files: true

  # One job per page: Lighthouse runs each URL 3 times, one after another, so
  # three pages in one job took ~2m45s. Separate runners also keep the
  # performance measurements from competing for CPU. The URL list here
  # overrides the one in .lighthouserc.json.
  lighthouse:
    name: Lighthouse (${{ matrix.page }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        page:
          - index.html
          - about/index.html
          - 2014/11/06/rules-of-communicating-at-github/index.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download Astro build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-astro
          path: dist-astro

      # No npm ci: npx fetches @lhci/cli on its own, and it needs nothing from
      # the project's dependencies.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --collect.url="http://localhost/${PAGE}"
        env:
          PAGE: ${{ matrix.page }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Keeps the "Lighthouse CI" required status check: it passes only if every
  # page in the matrix passed.
  lighthouse-result:
    name: Lighthouse CI
    needs: lighthouse
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Lighthouse results
        env:
          RESULT: ${{ needs.lighthouse.result }}
        run: |
          echo "Lighthouse matrix result: $RESULT"
          [ "$RESULT" = success ]

  playwright:
    name: Playwright Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Astro build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-astro
          path: dist-astro

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Browser System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Astro preview server
        run: |
          npm run preview -- --host &

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:4321; do sleep 1; done'

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:4321
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
