name: Astro E2E Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'tsconfig.astro.json'
      - 'public/**'
      - '*.md'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.lighthouserc.json'
      - '.lycheeignore'
      - 'package*.json'
      - '.github/workflows/astro-e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'tsconfig.astro.json'
      - 'public/**'
      - '*.md'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.lighthouserc.json'
      - '.lycheeignore'
      - 'package*.json'
      - '.github/workflows/astro-e2e.yml'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; main pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Astro build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.astro
          # The pipeline fingerprint (remark/rehype plugins, their config wiring, and
          # deps) is a distinct key segment AND the restore-keys prefix. Astro caches
          # rendered markdown per content-file digest and reuses it for unchanged files
          # regardless of plugin code, so a broad `astro-cache-<os>-` restore-key would
          # resurrect HTML built by an old pipeline (e.g. retired /q/<id> quote links).
          # Folding the pipeline hash into the prefix busts the cache when rendering
          # changes, while still reusing it across content-only edits.
          # src/data/acronyms.yml is rendering input (src/lib/rehype-acronyms.ts reads
          # it at module load), so it's part of the fingerprint too. Keep this key in
          # sync with build-and-deploy.yml.
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/lib/**', 'src/data/acronyms.yml', 'astro.config.mjs', 'src/content.config.ts', 'package-lock.json') }}-${{ hashFiles('src/**/*', 'public/**/*', 'tsconfig.astro.json') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-${{ hashFiles('src/lib/**', 'src/data/acronyms.yml', 'astro.config.mjs', 'src/content.config.ts', 'package-lock.json') }}-

      - name: Build Astro site
        run: npm run build

      - name: Upload Astro build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-astro
          path: dist-astro/
          retention-days: 1
          include-hidden-files: true

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Astro build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-astro
          path: dist-astro

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.0 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  playwright:
    name: Playwright Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Astro build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-astro
          path: dist-astro

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Browser System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Astro preview server
        run: |
          npm run preview -- --host &

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:4321; do sleep 1; done'

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:4321
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # Dedicated accessibility job using axe-core
  # Note: This complements Lighthouse CI accessibility audits with more comprehensive axe-core testing
  # - Lighthouse includes a subset of axe rules as part of its accessibility score
  # - This job runs the full axe-core test suite for WCAG 2.1 Level AA compliance
  # - Both are valuable: Lighthouse for overall metrics, axe-core for detailed accessibility testing
  accessibility:
    name: Axe Accessibility Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Astro build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-astro
          path: dist-astro

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Browser System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Astro preview server
        run: |
          npm run preview -- --host &

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:4321; do sleep 1; done'

      - name: Run Axe accessibility tests
        run: npm run test:e2e:accessibility
        env:
          BASE_URL: http://localhost:4321
          CI: true

      - name: Upload Accessibility Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 14

  # HTML validation + link checking against the same build the other jobs test,
  # instead of a separate workflow doing its own uncached build. PR-only: on main
  # a failure has nowhere useful to go (the scheduled issue-filing run was retired
  # in 33b729de), so it only gates changes before they merge.
  site-health:
    name: Validate built site
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Astro build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-astro
          path: dist-astro

      - name: Validate HTML (html-validate)
        run: npm run lint-html

      - name: Strip standard.site link tags before link check
        # The spec-required <link rel="site.standard.*" href="at://…"> tags (one
        # per post, plus the homepage publication tag) carry AT Protocol URIs.
        # lychee can't parse the at:// scheme — the colons in did:plc:… read as an
        # invalid port — so it emits a hard parse error that no --exclude,
        # --scheme, --remap, or .lycheeignore rule can suppress (they all run
        # after URL parsing). These tags are verification infrastructure, not
        # content links, so we drop them from this job's copy of the build
        # artifact before checking. Production output is unaffected: the deploy
        # workflow builds its own dist-astro. Runs after lint-html so the real
        # markup is validated first.
        run: |
          find dist-astro -name '*.html' -print0 \
            | xargs -0 sed -i -E 's#<link[^>]*rel="site\.standard\.(document|publication)"[^>]*>##g'

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Check built HTML plus source markdown (covers both rendered output and raw content)
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --accept '100..=103,200..=299,403,429'
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --root-dir ${{ github.workspace }}/dist-astro
            --include-fragments
            --index-files index.html
            './dist-astro/**/*.html'
            './src/content/**/*.md'
          format: markdown
          output: ./lychee-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lychee-report
          path: ./lychee-report.md
          retention-days: 30
