name: Astro E2E Tests

# No `paths` filter on the triggers: Build Astro Site, Lighthouse CI and
# Playwright Tests are required checks, and a path-filtered workflow never
# reports them, which left PRs that only touch other files (e.g. Actions
# bumps) unmergeable without an admin bypass. The `changes` job applies the
# filter instead; skipped jobs count as passing required checks.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; main pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  changes:
    name: Detect site changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      # Push events diff against the previous commit, which needs a checkout.
      # Pull requests use the API instead.
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            site:
              - 'src/**'
              - 'astro.config.mjs'
              - 'tsconfig.astro.json'
              - 'public/**'
              - '*.md'
              - 'e2e/**'
              - 'playwright.config.ts'
              - '.lighthouserc.json'
              - '.htmlvalidate.json'
              - 'package*.json'
              - 'assets/**'
              - 'script/inject-*'
              - 'script/remote-image-dimensions.json'
              - 'worker/**'
              - 'wrangler.json'
              - '.github/workflows/astro-e2e.yml'

  build:
    name: Build Astro Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Chromium, Astro render, and OG card caches; shared with build-and-deploy.yml.
      - name: Restore build caches
        uses: ./.github/actions/astro-build-caches

      - name: Build Astro site
        run: npm run build

      # Final file = public/_redirects + rules generated from front matter.
      - name: Validate built _redirects
        run: script/validate-redirects dist-astro/_redirects

      # html-validate only: it's deterministic and takes seconds. The lychee
      # link check stays in links.yml, which is disabled.
      - name: Validate HTML (html-validate)
        run: npm run lint-html

      - name: Upload Astro build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-astro
          path: dist-astro/
          retention-days: 1
          include-hidden-files: true

  # One job per page: Lighthouse runs each URL 3 times, one after another, so
  # three pages in one job took ~2m45s. Separate runners also keep the
  # performance measurements from competing for CPU. The URL list here
  # overrides the one in .lighthouserc.json.
  lighthouse:
    name: Lighthouse (${{ matrix.page }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        page:
          - index.html
          - about/index.html
          - 2014/11/06/rules-of-communicating-at-github/index.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Astro build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-astro
          path: dist-astro

      # No npm ci: npx fetches @lhci/cli on its own, and it needs nothing from
      # the project's dependencies.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --collect.url="http://localhost/${PAGE}"
        env:
          PAGE: ${{ matrix.page }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Keeps the "Lighthouse CI" required status check: it passes only if every
  # page in the matrix passed, or if no site files changed. It runs even when
  # upstream jobs fail, so it checks the changes job too rather than treating
  # a skipped matrix as a pass.
  lighthouse-result:
    name: Lighthouse CI
    needs: [changes, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Lighthouse results
        env:
          CHANGES: ${{ needs.changes.result }}
          SITE: ${{ needs.changes.outputs.site }}
          RESULT: ${{ needs.lighthouse.result }}
        run: |
          echo "Changes: $CHANGES, site changed: $SITE, Lighthouse matrix result: $RESULT"
          [ "$CHANGES" = success ] || exit 1
          [ "$SITE" != true ] || [ "$RESULT" = success ]

  playwright:
    name: Playwright Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Astro build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-astro
          path: dist-astro

      # Key on the Playwright version, not the whole lockfile, so unrelated
      # dependency bumps don't re-download the browser.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Browser System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Serve the build through the production Worker (worker/index.js on
      # workerd, via wrangler dev in local mode) rather than astro preview, so
      # the tests cover the Worker's routing, _headers, _redirects, and the
      # 404 page. Local mode needs no Cloudflare credentials.
      - name: Start local Worker
        run: npm run preview:worker > wrangler-dev.log 2>&1 &
        env:
          WRANGLER_SEND_METRICS: false

      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:8792/; do sleep 1; done' || { cat wrangler-dev.log; exit 1; }

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:8792
          CI: true

      - name: Show Worker log
        if: ${{ failure() }}
        run: cat wrangler-dev.log

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
