name: Supply Chain

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, mirroring CodeQL's cron, so dependency rot is caught without commits.
    - cron: "30 1 * * 0"

# Minimal by default; each job elevates only what it needs.
permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  # Scan git history (push/schedule) or the PR diff (pull_request) for committed secrets.
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so a secret buried in an old commit is still caught.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Dependency (CVE) scanning — the layer CodeQL's SAST doesn't cover.
  # Full lockfile scan on push/schedule; results land in the Security tab.
  deps:
    name: Dependency Vulnerabilities
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
      # Report-only for now: results populate the Security tab without gating.
      # Flip to true once the existing dependency-CVE backlog is triaged.
      fail-on-vuln: false

  # On PRs, only report vulnerabilities the PR newly introduces.
  deps-pr:
    name: Dependency Vulnerabilities (PR)
    if: github.event_name == 'pull_request'
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
      # Report-only for now; flip to true once the CVE backlog is triaged.
      fail-on-vuln: false

  # Lint the workflows themselves: actionlint (blocking, precise) + zizmor (advisory, SARIF).
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d # v1.7.7
        with:
          args: -color

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install zizmor
        run: pip install zizmor

      # Advisory for now — surfaces findings in the Security tab without gating
      # the build while existing workflows are triaged.
      - name: zizmor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # zizmor writes SARIF to stdout; redirect it. `|| true` because zizmor
        # exits non-zero when it has findings, which we surface (not gate) below.
        run: zizmor --format sarif .github/workflows/ > zizmor.sarif || true

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # Optional second-opinion SAST on top of CodeQL. Non-blocking: findings go to
  # the Security tab. Drop this job if it proves noisy.
  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Semgrep scan
        continue-on-error: true
        run: semgrep scan --config p/typescript --config p/security-audit --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
