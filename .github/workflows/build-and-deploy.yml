name: Deploy site to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  # Never cancel a running deploy: killing `wrangler deploy` mid-upload can
  # leave a partial release. A newer push still replaces any queued run.
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full commit history for the sitemap's per-page <lastmod> dates
          # (src/utils/sitemap-lastmod.ts). Blobless keeps it cheap: `git log
          # --name-only` needs commits and trees, not file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same type-check and unit tests CI runs. ci.yml runs
      # in a separate workflow on the same push, so it cannot block this job — and
      # `needs:` only works within one workflow file. Running them here (fail-fast,
      # before the expensive build) is what actually stops a broken build or failing
      # test from shipping to production.
      - name: Type-check (astro check)
        run: npm run check

      - name: Run unit tests (Vitest)
        run: npm run test:vitest

      # Chromium, Astro render, and OG card caches; shared with astro-e2e.yml.
      - name: Restore build caches
        uses: ./.github/actions/astro-build-caches

      # "Most read this month" on /posts/ comes from Cloudflare Web Analytics.
      # The JSON holds traffic counts, so it's generated here and gitignored
      # rather than committed to this public repo. Runs after the cache steps
      # because the Astro cache key hashes src/**, and a fresh file each deploy
      # would miss it every time. Best effort: the script exits 0 without a
      # file on any failure, and the build renders without the list. Needs a
      # separate token with "Account Analytics: Read"; the deploy token is
      # scoped to Workers.
      - name: Fetch popular posts
        continue-on-error: true
        timeout-minutes: 2
        run: npm run popular-posts
        env:
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}

      - name: Build Astro site
        run: npm run build

      # Final file = public/_redirects + rules generated from front matter.
      - name: Validate built _redirects
        run: script/validate-redirects dist-astro/_redirects

      # The zone's Markdown negotiation rewrite can't check that a file exists,
      # so a page without its .md sibling would 404 for agents.
      - name: Validate Markdown siblings
        run: script/validate-markdown-siblings dist-astro

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
