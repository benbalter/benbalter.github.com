name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '*.md'
      - 'dictionary.txt'
      - '.remarkrc.js'
      - '.remarkignore'
      - '.textlintrc'
      - '.vale.ini'
      - '.markdown-lint.yml'
      - '.markdownlint-cli2.cjs'
      - 'script/cibuild-content'
      - 'script/remark'
      - 'script/lint-text'
      - 'script/vale'
      - 'script/harper'
      - 'script/languagetool'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'assets/**'
      - 'js/**'
      - 'script/**'
      - 'eslint.config.js'
      - 'knip.jsonc'
      - '.yamllint.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - '*.md'
      - 'dictionary.txt'
      - '.remarkrc.js'
      - '.remarkignore'
      - '.textlintrc'
      - '.vale.ini'
      - '.markdown-lint.yml'
      - '.markdownlint-cli2.cjs'
      - 'script/cibuild-content'
      - 'script/remark'
      - 'script/lint-text'
      - 'script/vale'
      - 'script/harper'
      - 'script/languagetool'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'assets/**'
      - 'js/**'
      - 'script/**'
      - 'eslint.config.js'
      - 'knip.jsonc'
      - '.yamllint.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; main pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  content:
    name: Content Linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Commit history for the content integrity check (base..head diff and
          # commit trailers). Blobless keeps it cheap; git fetches the few
          # file versions it compares on demand.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      # Bulk passes (6+ posts) must not change code, scripts, URLs, or quoted
      # text, or delete prose. See script/check-content-integrity.ts; the
      # escape hatch is a `Content-Integrity: reviewed` commit trailer.
      - name: Check content integrity
        env:
          CONTENT_INTEGRITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CONTENT_INTEGRITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check-content-integrity

      # On PRs that only touch content, scope textlint to the changed posts; it
      # otherwise spends ~50s re-linting every post. Anything else in the diff
      # (a linter config, dictionary, script, or workflow) can change results
      # for every file, so script/changed-content says "all" and everything is
      # linted, as on every push to main.
      - name: Scope textlint to changed content
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(script/changed-content "$BASE" "$HEAD")
          if [ "$files" != all ]; then
            { echo 'CONTENT_FILES<<EOF'; echo "$files"; echo EOF; } >> "$GITHUB_ENV"
          fi

      - name: Install Harper
        env:
          HARPER_VERSION: v1.9.0
        run: |
          curl -fSL "https://github.com/Automattic/harper/releases/download/${HARPER_VERSION}/harper-cli-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv harper-cli /usr/local/bin/

      - name: Install Vale
        env:
          VALE_VERSION: 3.14.2
        run: |
          curl -fSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz vale
          sudo mv vale /usr/local/bin/

      - name: Cache Vale styles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .github/styles
          key: vale-styles-${{ hashFiles('.vale.ini', '.github/styles/AIPatterns/*.yml') }}

      - name: Sync Vale packages
        run: vale sync

      - name: script/cibuild-content
        run: script/cibuild-content

  code:
    name: Code Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint-js-check

      - name: Lint JSON
        run: npm run lint-json-check

      # Unused files, dependencies, and unlisted imports fail; unused
      # exports are reported as warnings (see knip.jsonc).
      - name: Knip (unused files and dependencies)
        run: npm run knip

      - name: Lint YAML
        run: npm run lint-yaml

  check:
    name: Run Astro Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro Check
        run: npm run check

  vitest:
    name: Run Vitest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests with coverage
        run: npm run test:vitest:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 14

  languagetool:
    name: LanguageTool Grammar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      languagetool:
        image: erikvl87/languagetool:6.8
        ports:
          - 8010:8010
        env:
          Java_Xms: 512m
          Java_Xmx: 1g
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # History for script/changed-content's merge-base diff. Blobless
          # keeps it cheap.
          fetch-depth: 0
          filter: blob:none

      # PRs that only touch content check just the changed posts (full runs
      # take ~45s); anything else, and every push to main, checks every post.
      - name: Decide which posts to check
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=all
          if [ "$EVENT" = pull_request ]; then
            files=$(script/changed-content "$BASE" "$HEAD")
          fi
          if [ "$files" = all ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          posts=$(printf '%s\n' "$files" | grep '^src/content/posts/' || true)
          if [ -z "$posts" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No changed posts; nothing for LanguageTool to check."
          else
            echo "mode=some" >> "$GITHUB_OUTPUT"
            { echo 'files<<EOF'; echo "$posts"; echo EOF; } >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for LanguageTool to start
        if: steps.scope.outputs.mode != 'none'
        run: |
          for i in $(seq 1 30); do
            if curl -sS -f http://localhost:8010/v2/languages > /dev/null 2>&1; then
              echo "LanguageTool is ready"
              exit 0
            fi
            echo "Waiting for LanguageTool... ($i/30)"
            sleep 2
          done
          echo "LanguageTool failed to start"
          exit 1

      - name: Run LanguageTool
        if: steps.scope.outputs.mode != 'none'
        env:
          LANGUAGETOOL_URL: http://localhost:8010
          FILES: ${{ steps.scope.outputs.files }}
        # FILES is empty in "all" mode, which script/languagetool treats as
        # every post. Word-splitting the list into arguments is intended.
        run: |
          # shellcheck disable=SC2086 # one argument per file is intended
          script/languagetool $FILES
