name: Email broadcast for new posts

# Runs after a successful deploy so subscribers aren't emailed before the post is live.
# workflow_run is intentional and safe here: permissions are read-only, no
# untrusted PR code is checked out, and it only fires on branches: [main] (which
# forks can't push to). The commit id it reads is passed via env, not expanded
# into shell.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ["Deploy site to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview what would be sent without actually sending'
        type: boolean
        default: true
      post_path:
        description: 'Path to a specific post file to broadcast (e.g., src/content/posts/2026-04-28-my-post.md)'
        type: string
        required: false

permissions:
  contents: read
  actions: read  # look up the previous successful deploy's commit

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect new posts
        id: detect
        # Pass context values through env so they're never expanded into the
        # shell source (prevents template-injection via crafted input).
        env:
          POST_PATH: ${{ inputs.post_path }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_ID: ${{ github.event.workflow_run.head_commit.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual dispatch with a specific post path
          if [ -n "$POST_PATH" ]; then
            if [ -f "$POST_PATH" ]; then
              echo "$POST_PATH" > /tmp/new-posts.txt
              echo "has_posts=true" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch for: $POST_PATH"
              exit 0
            else
              echo "❌ File not found: $POST_PATH"
              exit 1
            fi
          fi

          # Auto-detect from workflow_run trigger
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "No post_path provided for manual dispatch"
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff from the previous successful deploy, not just HEAD~1: the
          # deploy cancels in-progress runs, so when merges land close together
          # an earlier commit's deploy never succeeds and its posts would
          # otherwise be skipped. Only accept an ancestor of this commit, which
          # rules out newer deploys that finished first. Fall back to HEAD~1.
          AFTER="$HEAD_COMMIT_ID"
          BEFORE="${HEAD_COMMIT_ID}~1"
          for sha in $(gh api "repos/${REPO}/actions/workflows/build-and-deploy.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[].head_sha' 2>/dev/null); do
            if [ "$sha" != "$AFTER" ] && git merge-base --is-ancestor "$sha" "$AFTER" 2>/dev/null; then
              BEFORE="$sha"
              break
            fi
          done
          echo "Checking for new posts in ${BEFORE}..${AFTER}"

          # Find newly added post files
          NEW_POSTS=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'src/content/posts/' 2>/dev/null || echo "")

          if [ -z "$NEW_POSTS" ]; then
            echo "No new posts detected"
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New posts detected:"
          echo "$NEW_POSTS"
          echo "has_posts=true" >> "$GITHUB_OUTPUT"

          # Write post paths to a file for the next step
          echo "$NEW_POSTS" > /tmp/new-posts.txt

      - name: Setup Node
        if: steps.detect.outputs.has_posts == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_posts == 'true'
        run: npm ci

      - name: Send broadcast
        if: steps.detect.outputs.has_posts == 'true'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SITE_URL: https://ben.balter.com
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # A manual dispatch of a specific post is an intentional "send now" —
          # let it re-send past the already-broadcast dedupe check.
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.post_path != '' }}
        # Run via tsx: the script imports shared .ts pipeline modules whose
        # internal relative imports are extensionless. Plain `node` (native
        # type-stripping) enforces strict ESM resolution and can't resolve them;
        # tsx (used for every other TS script here) handles it.
        run: npx tsx script/email-broadcast.mjs /tmp/new-posts.txt
