# Advisory-only Vale config for tbhb/vale-ai-tells — NOT part of the CI gate.
#
# ai-tells defaults every rule to `error`, and ~150 of them fire on a single
# post — almost all of it deliberate voice (spaced em dashes, semicolons, verb
# tricolons, contrastive antithesis, "ship"). Gating on that would red-CI the
# whole 15-year archive. So it lives here as a manual review aid, in the same
# advisory tier as Harper/textlint: run `npm run vale-ai-tells -- <file>` to eyeball
# a draft for AI cadence. Nothing in this config can fail the build.
#
# The main .vale.ini keeps the ai-tells package in `Packages` (so `vale sync`
# fetches it) but deliberately omits it from `BasedOnStyles`.
StylesPath = .github/styles
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = ai-tells

# Disabled: these fire almost exclusively on deliberate voice, not tells, and
# their volume buries the actionable findings. Spaced em dashes, semicolons,
# verb tricolons, and "ship" are house style here, not AI cadence.
ai-tells.EmDashUsage = NO
ai-tells.SemicolonUsage = NO
ai-tells.VerbTricolon = NO
ai-tells.ShipOveruse = NO
# Second pass, judged against actual flagged text on real posts: these fire on
# deliberate voice or misfire on proper nouns, not on AI cadence.
ai-tells.ContrastiveFormulas = NO   # "a noun, not a verb" — antithesis is house voice
ai-tells.FigurativeQuantities = NO  # "a handful", "a pile of" — vivid, not filler
ai-tells.CataphoricForecasting = NO # "Two modes:", "Two categories:" — normal lead-ins
ai-tells.ColonUsage = NO            # only misfires on ": Pandoc"/": Tailwind" (proper nouns)
ai-tells.EmphaticCopula = NO        # italic *is*/*and* — deliberate emphasis
# Third pass, calibrated across the 2026 posts: these fire on Ben's signature
# rhetorical voice (fragments, anaphora, negation triads) or on domain vocab.
ai-tells.ParallelStaccato = NO   # "Pull requests. Code review." — fragment style (CLAUDE.md endorses)
ai-tells.MicDrop = NO            # "Keep the receipts." — deliberate punchy closers/taglines
ai-tells.StackedAnaphora = NO    # "What did you ship? What did you unblock?" — anaphora
ai-tells.ContrastiveNegation = NO # "no standups, no sprint planning" — negation triads
ai-tells.FormalRegister = NO     # "prioritize/optimize/implementation" — domain vocab, not cadence
ai-tells.FillerIntensifier = NO  # only fires on "single", usually meaningful
# Fourth pass — the decisive one. Compared firing rates on 2019-2021 posts
# (definitionally pre-ChatGPT, so 100% human Ben) vs 2026. Rules that fire as
# often or MORE in the pre-AI baseline are timeless voice, not drift, no matter
# what they're named — disable them. This turns the advisory into a personalized
# DRIFT detector: it only surfaces cadence that's genuinely new to Ben's writing.
ai-tells.FormalTransitions = NO  # 2.84/post pre-AI vs 1.0 in 2026 — MORE common before ChatGPT
ai-tells.OverusedVocabulary = NO # 1.84 -> 1.09 — longstanding vocab, declining
ai-tells.EmptyPadding = NO       # 0.84 -> 0.45 — stable voice
ai-tells.HedgingPhrases = NO     # 0.48 -> 0.18 — stable/declining
ai-tells.FillerPhrases = NO      # 0.48 -> 0.36 — stable
ai-tells.NounString = NO         # 0.40 -> 0.27 — stable
ai-tells.DefensiveHedges = NO    # 0.40 -> 0.00 — pre-AI only
# Fifth pass — fine-tuned to house style by reading the ACTUAL text each rule
# flags on pre-AI posts. Every match below is Ben's pre-ChatGPT voice, so the
# rule is measuring house style, not AI. Disabled to drive the pre-AI false-
# positive rate toward zero (the detector should never flag 2020-era Ben).
ai-tells.MicDropHeadings = NO         # "Loud, not bragging" / "Intentionality over proximity" — signature X-not-Y headings
ai-tells.Metacommentary = NO          # "This means that", "Think of it as" — explanatory voice
ai-tells.SycophancyMarkers = NO       # "of course", "certainly" — emphasis, not "Great question!"
ai-tells.AffirmativeFormulas = NO     # "the reality is", "that's the beauty of"
ai-tells.OpeningCliches = NO          # "when it comes to", "chances are"
ai-tells.OverusedVocabularyVerbs = NO # "foster"/"fostering" — community vocabulary
ai-tells.JourneyMetaphors = NO        # "along the way", "a long way"
ai-tells.GrowthMetaphors = NO         # "cultivating", "nurtured"
ai-tells.UniversalObject = NO         # "avoiding all the", "solved all those"
ai-tells.ConclusionMarkers = NO       # "At the end of the day", "Ultimately"
ai-tells.SelfReference = NO           # "remember that", "as we saw"
ai-tells.AIAdjectiveNounPairs = NO    # "sophisticated workflows/tools" — his usage since 2020
ai-tells.ServesAsDodge = NO           # "serves as a" — used pre-AI, no drift discrimination
ai-tells.AnthropomorphicCognition = NO # parser false positives ("a platform and want")
ai-tells.EmptyPaddingStacked = NO     # "various repository events"
ai-tells.WrapUpHeadings = NO          # "Putting it all together"
# Kept ON — genuine drift vs Ben's EVOLVED voice. The baseline that matters is
# the most recent pre-ChatGPT window (2019-2022), not the flat 2010-2022 corpus:
# style naturally evolved over 12 years, so a phrase heavy in 2012 but gone by
# 2019 is evolved-away, and its return in 2026 is signal, not house style.
#   AnthropomorphicJustification  0.07/post (19-22) -> 1.09 (2026)  16x
#   LabelAndExplain               0.03 -> 0.45                      15x
#   FigurativeFalls               0.00 -> 0.36   (dropped by 2019, re-emerged)
#   FigurativeDisguises           0.00 -> 0.36   ("in a trench coat")
#   FigurativeIdioms              0.03 -> 0.36
# NB: a flat 2010-2022 baseline mislabels the last two as house style (they were
# early-2010s habits); only the era-trend reveals them as genuine 2026 drift.
