<text x="840" y="581.2" font-size="19" text-anchor="middle" style="fill:var(--muted)">Bluetooth: cues each line,</text>
<text x="840" y="607.2" font-size="19" text-anchor="middle" style="fill:var(--muted)">hears when it starts and ends</text>
