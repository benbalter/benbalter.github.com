<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc">
<title id="title">How the porch show fits together</title>
<desc id="desc">Diagram. halloween/show.toml is built by halloween.py into pink.dlc, blue.dlc and show.json, which flash.py uploads to each Furby over Bluetooth. An ESP32 board (or a laptop running porch.py) triggers actions on the pink and blue Furbies over Bluetooth and hears back when each starts and ends. A motion sensor and a button start greetings on the board; an iPhone remote talks to the board over Bluetooth, sending commands and reading its status. EyeLights glasses run on their own with no link to the show.</desc>
<style>svg{--card:#f8f7f4;--panel:#ffffff;--chip:#f0ede6;--ink:#1d1d1f;--muted:#5c5c66;--rule:#d6d3cc;--grid:#e8e5de;--pink:#c2337a;--blue:#2f6fd0;--pink-tint:#efc2d8;--blue-tint:#c4d6f3;--grey:#78787f;--grey-tint:#d6d6da;--amber:#b08014;--eyes:#e1d6ec;--audio:#d6e6de;--links:#ece9e2}@media (prefers-color-scheme: dark){svg{--card:#1c1d21;--panel:#25262b;--chip:#2c2d33;--ink:#ececf0;--muted:#a5a5af;--rule:#3d3e45;--grid:#2c2d33;--pink:#e0609e;--blue:#5b93e6;--pink-tint:#5a2b44;--blue-tint:#26395a;--grey:#9a9aa3;--grey-tint:#45464d;--amber:#d9a640;--eyes:#3d3350;--audio:#2b4237;--links:#34353b}}text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif}</style>
<rect x="0" y="0" width="1600" height="1000" rx="28" style="fill:var(--card)"/>
<text x="60" y="75.2" font-size="40" font-weight="700" style="fill:var(--ink)">How the porch show fits together</text>
<text x="60" y="115.6" font-size="22" style="fill:var(--muted)">Bluetooth Low Energy (BLE) links, the build that feeds them, and the one prop that runs on its own.</text>
<rect x="60" y="160" width="133" height="44" rx="22" style="fill:var(--chip);stroke:var(--rule);stroke-width:2"/>
<text x="126.5" y="186.8" font-size="21" text-anchor="middle" style="fill:var(--ink)">show.toml</text>
<line x1="199" y1="182" x2="233" y2="182" style="fill:none;stroke:var(--muted);stroke-width:3"/>
<polygon points="233,182 218.593,175.041 218.593,188.959" style="fill:var(--muted)"/>
<rect x="239" y="160" width="158" height="44" rx="22" style="fill:var(--chip);stroke:var(--rule);stroke-width:2"/>
<text x="318" y="186.8" font-size="21" text-anchor="middle" style="fill:var(--ink)">halloween.py</text>
<line x1="403" y1="182" x2="437" y2="182" style="fill:none;stroke:var(--muted);stroke-width:3"/>
<polygon points="437,182 422.593,175.041 422.593,188.959" style="fill:var(--muted)"/>
<rect x="443" y="160" width="291" height="44" rx="22" style="fill:var(--chip);stroke:var(--rule);stroke-width:2"/>
<text x="588.5" y="186.8" font-size="21" text-anchor="middle" style="fill:var(--ink)">pink.dlc · blue.dlc · show.json</text>
<line x1="740" y1="182" x2="774" y2="182" style="fill:none;stroke:var(--muted);stroke-width:3"/>
<polygon points="774,182 759.593,175.041 759.593,188.959" style="fill:var(--muted)"/>
<rect x="780" y="160" width="113" height="44" rx="22" style="fill:var(--chip);stroke:var(--rule);stroke-width:2"/>
<text x="836.5" y="186.8" font-size="21" text-anchor="middle" style="fill:var(--ink)">flash.py</text>
<text x="909" y="186" font-size="20" style="fill:var(--muted)">BLE upload to each Furby: about 2–3½ min, about 350 KB max</text>
<rect x="60" y="280" width="540" height="100" rx="14" style="fill:var(--card);stroke:var(--muted);stroke-width:2;stroke-dasharray:10 10"/>
<text x="78" y="314.8" font-size="26" font-weight="700" style="fill:var(--ink)">or a laptop: porch.py</text>
<text x="78" y="348" font-size="20" style="fill:var(--muted)">Same show engine (furbyshow.py), over bleak</text>
<rect x="60" y="420" width="540" height="180" rx="14" style="fill:var(--panel);stroke:var(--ink);stroke-width:3"/>
<text x="78" y="454.8" font-size="26" font-weight="700" style="fill:var(--ink)">ESP32 board</text>
<text x="78" y="488" font-size="20" style="fill:var(--muted)">DFRobot FireBeetle 2 ESP32-S3</text>
<text x="78" y="516" font-size="20" style="fill:var(--muted)">MicroPython + aioble, hidden</text>
<text x="78" y="544" font-size="20" style="fill:var(--muted)">on the porch; LED blinks who to wake next</text>
