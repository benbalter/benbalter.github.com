<polygon points="475,600 468.041,614.407 481.959,614.407" style="fill:var(--ink)"/>
<rect x="447" y="646" width="56" height="26" rx="0" style="fill:var(--card)"/>
<text x="453" y="663.2" font-size="19" style="fill:var(--muted)">press</text>
<rect x="1080" y="260" width="460" height="160" rx="14" style="fill:var(--panel);stroke:var(--pink);stroke-width:3"/>
