<text x="132.5" y="186.8" font-size="21" text-anchor="middle" style="fill:var(--ink)">show script</text>
<line x1="211" y1="182" x2="245" y2="182" style="fill:none;stroke:var(--muted);stroke-width:3"/>
<polygon points="245,182 230.593,175.041 230.593,188.959" style="fill:var(--muted)"/>
<rect x="251" y="160" width="207" height="44" rx="22" style="fill:var(--chip);stroke:var(--rule);stroke-width:2"/>
<text x="354.5" y="186.8" font-size="21" text-anchor="middle" style="fill:var(--ink)">one DLC per Furby</text>
<line x1="464" y1="182" x2="498" y2="182" style="fill:none;stroke:var(--muted);stroke-width:3"/>
<polygon points="498,182 483.593,175.041 483.593,188.959" style="fill:var(--muted)"/>
<rect x="504" y="160" width="259" height="44" rx="22" style="fill:var(--chip);stroke:var(--rule);stroke-width:2"/>
<text x="633.5" y="186.8" font-size="21" text-anchor="middle" style="fill:var(--ink)">uploaded over Bluetooth</text>
<text x="779" y="186" font-size="20" style="fill:var(--muted)">about 2–3½ min each, 350 KB max</text>
<rect x="60" y="280" width="540" height="100" rx="14" style="fill:var(--card);stroke:var(--muted);stroke-width:2;stroke-dasharray:10 10"/>
<text x="78" y="314.8" font-size="26" font-weight="700" style="fill:var(--ink)">or a laptop</text>
<text x="78" y="348" font-size="20" style="fill:var(--muted)">running the same show</text>
<rect x="60" y="420" width="540" height="180" rx="14" style="fill:var(--panel);stroke:var(--ink);stroke-width:3"/>
<text x="78" y="454.8" font-size="26" font-weight="700" style="fill:var(--ink)">Show board</text>
<text x="78" y="480.8" font-size="16" style="fill:var(--muted)">an ESP32: DFRobot FireBeetle 2</text>
<text x="78" y="512" font-size="20" style="fill:var(--muted)">A small Bluetooth board, hidden on the porch.</text>
<text x="78" y="540" font-size="20" style="fill:var(--muted)">Its light says which Furby to wake next.</text>
