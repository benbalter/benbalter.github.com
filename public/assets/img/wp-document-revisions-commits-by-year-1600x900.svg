dependency bots). Every commit from my account since May 2025 was written by AI agents. 2026 is the busiest year in the plugin's history, after a low point of 44 commits in 2024.</desc><style>svg{--card:#fcfcfb;--ink:#1d1d1f;--muted:#5c5c66;--grid:#e8e5de;--rule:#c9c6bf;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}
